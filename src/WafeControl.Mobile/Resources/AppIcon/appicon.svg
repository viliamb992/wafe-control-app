<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background: brand blue (#3090DC), lighter at the top like the Windows icon. The platforms apply their own mask. -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3398E8"/>
      <stop offset="1" stop-color="#2C87CF"/>
    </linearGradient>
  </defs>
  <rect width="456" height="456" fill="url(#brand)"/>
</svg>
