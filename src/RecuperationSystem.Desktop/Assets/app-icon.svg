<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#gradient1)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring (Ventilation System) -->
  <circle cx="128" cy="128" r="85" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.3"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.2"/>
  
  <!-- Fan Blades (4 curved blades) -->
  <g filter="url(#shadow)" opacity="0.95">
    <!-- Blade 1 -->
    <path d="M 128 128 Q 100 100 80 90 Q 85 75 100 70 Q 115 80 128 128 Z" fill="#FFFFFF"/>
    <!-- Blade 2 -->
    <path d="M 128 128 Q 156 100 176 90 Q 171 75 156 70 Q 141 80 128 128 Z" fill="#FFFFFF"/>
    <!-- Blade 3 -->
    <path d="M 128 128 Q 156 156 176 166 Q 171 181 156 186 Q 141 176 128 128 Z" fill="#FFFFFF"/>
    <!-- Blade 4 -->
    <path d="M 128 128 Q 100 156 80 166 Q 85 181 100 186 Q 115 176 128 128 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Center Circle -->
  <circle cx="128" cy="128" r="20" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="12" fill="url(#gradient2)"/>
  
  <!-- Air Flow Arrows (indicating circulation) -->
  <g opacity="0.8">
    <!-- Top Arrow -->
    <path d="M 128 35 L 128 25 M 128 25 L 123 30 M 128 25 L 133 30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Right Arrow -->
    <path d="M 221 128 L 231 128 M 231 128 L 226 123 M 231 128 L 226 133" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Bottom Arrow -->
    <path d="M 128 221 L 128 231 M 128 231 L 123 226 M 128 231 L 133 226" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Left Arrow -->
    <path d="M 35 128 L 25 128 M 25 128 L 30 123 M 25 128 L 30 133" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
