# Release: publishes the WinUI app (unpackaged, self-contained) for x64 and ARM64, builds an installer
# for each (installer/WafeControl.iss, Inno Setup) and attaches them to a GitHub Release.
#
# Trigger by pushing a version tag:   git tag v1.2.0 && git push origin v1.2.0
#   - Tags with a suffix (v1.2.0-beta.1) become a pre-release.
#   - Version = the tag without "v"; FileVersion = <major.minor.patch>.<run number>.
# Running it manually (Actions → Release → Run workflow) builds the installers as workflow artifacts
# only, without creating a release.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # The mobile app (MAUI, Android) is part of the solution; the runner has the Android SDK and JDK.
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
    - name: Build
      run: dotnet build WafeControl.slnx --configuration Release
    # Microsoft.Testing.Platform mode (global.json): the solution is passed with --solution.
    - name: Test
      run: dotnet test --solution WafeControl.slnx --no-build --configuration Release

  publish:
    needs: test
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
            arch: x64
          - platform: ARM64
            rid: win-arm64
            arch: arm64

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # v1.2.0 → 1.2.0; manual runs without a tag get 0.0.0-dev.
    - name: Compute version
      id: version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.0.0-dev' }
        if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') {
          throw "Tag '$env:GITHUB_REF_NAME' is not a version like v1.2.0 or v1.2.0-beta.1"
        }
        $numeric = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
        "version=$version" >> $env:GITHUB_OUTPUT
        "file_version=$numeric.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
        "assembly_version=$numeric.0" >> $env:GITHUB_OUTPUT

    - name: Publish
      run: >
        dotnet publish src/WafeControl.WinUI/WafeControl.WinUI.csproj
        --configuration Release
        --runtime ${{ matrix.rid }}
        --self-contained
        --output publish
        -p:Platform=${{ matrix.platform }}
        -p:Version=${{ steps.version.outputs.version }}
        -p:FileVersion=${{ steps.version.outputs.file_version }}
        -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
        -p:DebugType=None
        -p:DebugSymbols=false

    # Pinned and hash-checked; installed portably (no registry, no Program Files).
    - name: Install Inno Setup
      shell: pwsh
      run: |
        $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
        $sha256 = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
        $setup = "$env:RUNNER_TEMP\innosetup.exe"
        Invoke-WebRequest $url -OutFile $setup
        if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $sha256) { throw 'Inno Setup download hash mismatch' }
        $dir = "$env:RUNNER_TEMP\inno"
        $p = Start-Process $setup -ArgumentList '/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"" -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
        "$dir" >> $env:GITHUB_PATH

    - name: Build installer
      run: >
        iscc
        /DAppVersion=${{ steps.version.outputs.version }}
        /DFileVersion=${{ steps.version.outputs.file_version }}
        /DArch=${{ matrix.arch }}
        /DSourceDir=${{ github.workspace }}\publish
        /O${{ github.workspace }}\dist
        installer\WafeControl.iss

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}
        path: dist/*.exe
        if-no-files-found: error

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=""
        if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
        gh release create "$TAG" dist/*.exe \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG (Windows 11)" \
          --generate-notes \
          --verify-tag \
          $prerelease
