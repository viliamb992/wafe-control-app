# Release: publishes the WinUI app (unpackaged, self-contained) for x64 and ARM64, packs each with Velopack
# (a one-click Setup.exe plus the update packages) and attaches them to a GitHub Release, where the app's
# updater finds them.
#
# Trigger by pushing a version tag:   git tag v1.2.0 && git push origin v1.2.0
#   - Tags with a suffix (v1.2.0-beta.1) become a pre-release; the app offers them only with "Get beta versions".
#   - Version = the tag without "v"; FileVersion = <major.minor.patch>.<run number>.
#   - Release notes: the "## 1.2.0" section of CHANGELOG.md, shown in the app's update flyout and on the release.
#   - Each architecture is a Velopack channel (win-x64, win-arm64); the previous release's package is downloaded
#     first, so updates from it are small delta packages.
# Running it manually (Actions → Release → Run workflow) builds the packages as workflow artifacts only,
# without creating a release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   GLITCHTIP_DSN_WINDOWS   where crash reports go (README → Release → Crash reports). Optional: without it the
#                           app has no crash reports and hides the setting.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VPK_VERSION: 1.2.158   # keep equal to the Velopack package in Directory.Packages.props

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # The mobile app (MAUI, Android) is part of the solution; the runner has the Android SDK and JDK.
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
    - name: Build
      run: dotnet build WafeControl.slnx --configuration Release
    # Microsoft.Testing.Platform mode (global.json): the solution is passed with --solution.
    - name: Test
      run: dotnet test --solution WafeControl.slnx --no-build --configuration Release

  publish:
    needs: test
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # v1.2.0 → 1.2.0; manual runs without a tag get 0.0.0-dev.
    - name: Compute version
      id: version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.0.0-dev' }
        if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') {
          throw "Tag '$env:GITHUB_REF_NAME' is not a version like v1.2.0 or v1.2.0-beta.1"
        }
        $numeric = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
        "version=$version" >> $env:GITHUB_OUTPUT
        "file_version=$numeric.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
        "assembly_version=$numeric.0" >> $env:GITHUB_OUTPUT
        "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

    # The "## 1.2.0" section of CHANGELOG.md (up to the next "## "), or a pointer to the commits.
    - name: Release notes
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $changelog = Get-Content CHANGELOG.md -Raw
        $section = [regex]::Match($changelog, "(?ms)^## \[?$([regex]::Escape($env:VERSION))\]?[^\n]*\n(.*?)(?=^## |\z)")
        $notes = if ($section.Success -and $section.Groups[1].Value.Trim()) { $section.Groups[1].Value.Trim() } else { 'See the commits since the previous release.' }
        Set-Content release-notes.md $notes -Encoding utf8
        Get-Content release-notes.md

    # Symbols are embedded in the app's own DLLs, so crash stacks in logs and reports carry file and line.
    # The DSN is empty unless the secret is set; then the app has no crash reports.
    - name: Publish
      run: >
        dotnet publish src/WafeControl.WinUI/WafeControl.WinUI.csproj
        --configuration Release
        --runtime ${{ matrix.rid }}
        --self-contained
        --output publish
        -p:Platform=${{ matrix.platform }}
        -p:Version=${{ steps.version.outputs.version }}
        -p:FileVersion=${{ steps.version.outputs.file_version }}
        -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
        -p:DebugType=embedded
        -p:ContinuousIntegrationBuild=true
        "-p:CrashReportsDsn=${{ secrets.GLITCHTIP_DSN_WINDOWS }}"

    - name: Install Velopack
      run: dotnet tool install --global vpk --version ${{ env.VPK_VERSION }}

    # The previous release of this channel, so the new one also gets a small delta package.
    # The first Velopack release has none; that's fine.
    - name: Download previous release
      if: github.event_name == 'push'
      continue-on-error: true
      run: >
        vpk download github
        --repoUrl ${{ github.server_url }}/${{ github.repository }}
        --token ${{ github.token }}
        --channel ${{ matrix.rid }}
        --outputDir releases

    - name: Pack
      run: >
        vpk pack
        --packId WafeControl.App
        --packVersion ${{ steps.version.outputs.version }}
        --packDir publish
        --mainExe WafeControl.WinUI.exe
        --packTitle "WAFE Control"
        --packAuthors "Viliam Birmon"
        --icon src/WafeControl.WinUI/Assets/app-icon.ico
        --channel ${{ matrix.rid }}
        --shortcuts StartMenuRoot
        --releaseNotes release-notes.md
        --outputDir releases

    # Only this version's files go to the release; the downloaded previous package was just the delta base.
    - name: Collect release files
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        New-Item -ItemType Directory dist | Out-Null
        Get-ChildItem releases -File |
          Where-Object { $_.Name -notlike '*.nupkg' -or $_.Name -like "*-$env:VERSION-*" } |
          Copy-Item -Destination dist
        Get-ChildItem dist | Format-Table Name, Length

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}
        path: dist/*
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      if: matrix.rid == 'win-x64'
      with:
        name: release-notes
        path: release-notes.md

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: win-*
        path: dist
        merge-multiple: true

    - uses: actions/download-artifact@v4
      with:
        name: release-notes

    # Both channels' files side by side; their names don't collide (releases.win-x64.json, …-win-arm64-Setup.exe).
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=""
        if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
        gh release create "$TAG" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG (Windows 11)" \
          --notes-file release-notes.md \
          --generate-notes \
          --verify-tag \
          $prerelease
