# Android release: tests, publishes the mobile app as a signed APK (for sideloading) and attaches it to a
# GitHub Release. Separate from the desktop release (release.yml), with its own tags.
#
# Trigger by pushing an Android version tag:   git tag android-v1.0.0 && git push origin android-v1.0.0
#   - Tags with a suffix (android-v1.0.0-beta.1) become a pre-release.
#   - versionName = the tag without "android-v"; versionCode = 1000 + the workflow run number, so every
#     build installs over the previous one. The offset keeps it above the APKs built before the repository
#     was recreated (September 2026), whose run numbers started over.
#   - The release is never marked "latest": that stays the desktop release, which the Windows updater reads.
# Running it manually (Actions → Release Android → Run workflow) builds the APK as a workflow artifact only.
#
# Secrets (Settings → Secrets and variables → Actions), from your keystore (see README → Android signing):
#   ANDROID_KEYSTORE_BASE64    the .keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password (the same as the store password unless you chose another)
#   GLITCHTIP_DSN_ANDROID      where crash reports go (docs/plans/crash-tracking.md). Optional: without it the
#                              app has no crash reports and hides the setting.

name: Release Android

on:
  push:
    tags: [ "android-v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # The runner has the Android SDK and JDK.
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    # Microsoft.Testing.Platform mode (global.json): the project is passed with --project.
    - name: Test
      run: dotnet test --project src/WafeControl.Tests/WafeControl.Tests.csproj --configuration Release

    # android-v1.2.0 → 1.2.0; manual runs without a tag get 0.0.0-dev.
    - name: Compute version
      id: version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^android-v', '' } else { '0.0.0-dev' }
        if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') {
          throw "Tag '$env:GITHUB_REF_NAME' is not a version like android-v1.2.0 or android-v1.2.0-beta.1"
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        "version_code=$(1000 + [int]$env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_OUTPUT

    - name: Restore keystore
      shell: pwsh
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if (-not $env:KEYSTORE_BASE64) { throw 'Secret ANDROID_KEYSTORE_BASE64 is missing (see the comment at the top of this workflow).' }
        [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\wafe.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))

    # Passwords reach the build as env:NAME, so they never appear on the command line or in logs.
    # The DSN is empty unless the secret is set; then the app has no crash reports.
    - name: Publish
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: >
        dotnet publish src/WafeControl.Mobile/WafeControl.Mobile.csproj
        --framework net10.0-android
        --configuration Release
        --output publish
        -p:AndroidPackageFormats=apk
        -p:Version=${{ steps.version.outputs.version }}
        -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
        -p:ApplicationVersion=${{ steps.version.outputs.version_code }}
        -p:AndroidKeyStore=true
        -p:AndroidSigningKeyStore=${{ runner.temp }}\wafe.keystore
        -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
        -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
        -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
        -p:ContinuousIntegrationBuild=true
        "-p:CrashReportsDsn=${{ secrets.GLITCHTIP_DSN_ANDROID }}"

    - name: Name the APK
      shell: pwsh
      run: |
        New-Item -ItemType Directory dist | Out-Null
        $apk = Get-ChildItem publish -Filter '*-Signed.apk' | Select-Object -First 1
        if (-not $apk) { throw 'No signed APK was published.' }
        Copy-Item $apk.FullName "dist\WafeControl-${{ steps.version.outputs.version }}-android.apk"

    - name: Remove keystore
      if: always()
      shell: pwsh
      run: Remove-Item "$env:RUNNER_TEMP\wafe.keystore" -ErrorAction SilentlyContinue

    - uses: actions/upload-artifact@v4
      with:
        name: android
        path: dist/*.apk
        if-no-files-found: error

    # Crash reports from Android show method names; the PDBs give file and line, and R8's mapping names the Java
    # frames. Kept with the run, not in the APK.
    - uses: actions/upload-artifact@v4
      with:
        name: android-symbols
        path: |
          src/WafeControl.Mobile/bin/Release/net10.0-android/**/*.pdb
          src/WafeControl.Mobile/bin/Release/net10.0-android/mapping.txt
        retention-days: 90
        if-no-files-found: warn

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: android
        path: dist

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=""
        if [[ "$TAG" == *-*-* ]]; then prerelease="--prerelease"; fi
        gh release create "$TAG" dist/*.apk \
          --repo "$GITHUB_REPOSITORY" \
          --title "v${TAG#android-v} (Android)" \
          --notes "Android app for sideloading: download the APK on your phone and open it. Updates install over the previous version." \
          --latest=false \
          --verify-tag \
          $prerelease
