# Builds and tests the whole solution. Windows runner: the WinUI 3 app only builds on Windows.

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # The mobile app (MAUI, Android) is part of the solution; the runner has the Android SDK and JDK.
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
    - name: Restore dependencies
      run: dotnet restore WafeControl.slnx
    - name: Build
      run: dotnet build WafeControl.slnx --no-restore --configuration Release
    # Microsoft.Testing.Platform mode (global.json): the solution is passed with --solution.
    - name: Test
      run: dotnet test --solution WafeControl.slnx --no-build --configuration Release
